version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: audioverse_postgres
    restart: always
    environment:
      POSTGRES_USER: audioverse
      POSTGRES_PASSWORD: audioverse_password
      POSTGRES_DB: audioverse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: audioverse_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@audioverse.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

  redis:
    image: redis:7
    container_name: audioverse_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
